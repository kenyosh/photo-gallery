<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      padding: 2rem;
    }

    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      object-fit: cover;
    }

    h1 {
      text-align: center;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <h1 id="albumTitle">Gallery</h1>
  <div class="gallery" id="galleryContainer"></div>

  <script>
    // Get album folder from URL
    const params = new URLSearchParams(window.location.search);
    const albumFolder = params.get("album");

    if (!albumFolder) {
      document.getElementById("albumTitle").textContent = "Album Not Found";
      document.getElementById("galleryContainer").innerHTML = "<p>No album specified in URL.</p>";
    } else {
      const imageCount = 20; // change this to match how many images each album has
      const container = document.getElementById("galleryContainer");

      document.getElementById("albumTitle").textContent = albumFolder.split("/").pop();

      for (let i = 1; i <= imageCount; i++) {
        const img = document.createElement("img");
        img.src = `../${albumFolder}/img${i}.jpg`;
        img.alt = `Image ${i}`;
        container.appendChild(img);
      }
    }
  </script>
</body>
</html>
